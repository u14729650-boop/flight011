{# Flight search form. Pass `s` (dict of current values) to pre-fill it. #}
{% set s = s or {} %}
<form class="search glass tilt" action="{{ url_for('search') }}" method="get" id="searchForm">
  <div class="trip-tabs">
    <label><input type="radio" name="trip" value="oneway" {{ 'checked' if s.get('trip', 'oneway') == 'oneway' }}> One way</label>
    <label><input type="radio" name="trip" value="round" {{ 'checked' if s.get('trip') == 'round' }}> Round trip</label>
  </div>
  <div class="search-grid">
    <div class="field field-from">
      <label>From</label>
      <input list="airportList" name="origin" id="origin" placeholder="City or airport" required autocomplete="off"
             value="{{ (airports[s.origin][0] ~ ' (' ~ s.origin ~ ')') if s.get('origin') in airports else '' }}">
    </div>
    <button type="button" class="swap" id="swapBtn" title="Swap">⇄</button>
    <div class="field field-to">
      <label>To</label>
      <input list="airportList" name="dest" id="dest" placeholder="City or airport" required autocomplete="off"
             value="{{ (airports[s.dest][0] ~ ' (' ~ s.dest ~ ')') if s.get('dest') in airports else '' }}">
    </div>
    <div class="field">
      <label>Departure</label>
      <input type="date" name="depart" id="depart" required min="{{ today.isoformat() }}"
             value="{{ s.depart.isoformat() if s.get('depart') else '' }}">
    </div>
    <div class="field field-return">
      <label>Return</label>
      <input type="date" name="return" id="returnDate" min="{{ today.isoformat() }}"
             value="{{ s.ret.isoformat() if s.get('ret') else '' }}">
    </div>
    <div class="field">
      <label>Travellers</label>
      <div class="pax">
        <select name="adults" title="Adults (12+)">{% for n in range(1, 10) %}<option value="{{ n }}" {{ 'selected' if s.get('adults', 1) == n }}>{{ n }} Adult{{ 's' if n > 1 }}</option>{% endfor %}</select>
        <select name="children" title="Children (2-11)">{% for n in range(0, 9) %}<option value="{{ n }}" {{ 'selected' if s.get('children', 0) == n }}>{{ n }} Child</option>{% endfor %}</select>
        <select name="infants" title="Infants (under 2)">{% for n in range(0, 5) %}<option value="{{ n }}" {{ 'selected' if s.get('infants', 0) == n }}>{{ n }} Infant</option>{% endfor %}</select>
      </div>
    </div>
    <div class="field">
      <label>Class</label>
      <select name="cabin">
        {% for code, c in cabins.items() %}<option value="{{ code }}" {{ 'selected' if s.get('cabin') == code }}>{{ c[0] }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Currency</label>
      <select name="currency">
        {% for code in currencies %}<option value="{{ code }}" {{ 'selected' if s.get('currency', 'USD') == code }}>{{ code }}</option>{% endfor %}
      </select>
    </div>
    <button class="btn btn-search" type="submit">🔍 Search Flights</button>
  </div>
  <p class="live-quote" id="liveQuote"></p>
  <datalist id="airportList">
    {% for code, a in airports.items() %}<option value="{{ a[0] }} ({{ code }})">{{ a[1] }}, {{ a[2] }}</option>{% endfor %}
  </datalist>
</form>
