{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="auth">
  <div class="auth-art scroll-3d" data-depth="0.6" aria-hidden="true">
    <div class="boarding-3d tilt">
      <span class="code big">JOIN</span>
      <svg viewBox="0 0 64 64"><use href="#plane-icon"/></svg>
      <span class="code big">FLY</span>
    </div>
  </div>
  <form method="post" class="auth-card glass tilt">
    <h1>Create your account ✈</h1>
    <p class="muted">It takes 20 seconds, and your trips are saved forever.</p>
    <input type="hidden" name="next" value="{{ next }}">
    <label>Full name<input name="name" required placeholder="Aarav Sharma"></label>
    <label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
    <label>Mobile<input name="phone" placeholder="+91 90000 00000"></label>
    <div class="two">
      <label>Password<input type="password" name="password" required minlength="6" placeholder="min 6 characters"></label>
      <label>Confirm<input type="password" name="confirm" required minlength="6" placeholder="repeat password"></label>
    </div>
    <button class="btn btn-search" type="submit">Sign up</button>
    <p class="muted small center">Already have an account? <a href="{{ url_for('login', next=next) }}">Log in</a></p>
  </form>
</section>
{% endblock %}
