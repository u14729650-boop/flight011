{% extends "base.html" %}
{% block title %}World map{% endblock %}
{% block content %}
<section class="container">
  <h1 class="page-title">🌍 Flight world map</h1>
  <p class="muted">Click an airport to set <b>From</b>, then another to set <b>To</b>. Pick a date to see the live cheapest fare, then search.</p>
  <div class="map-card glass">
    <div class="map-controls">
      <select id="mapFrom"><option value="">From…</option>{% for c, a in airports.items() %}<option value="{{ c }}">{{ a[0] }} ({{ c }})</option>{% endfor %}</select>
      <button type="button" class="swap" id="mapSwap">⇄</button>
      <select id="mapTo"><option value="">To…</option>{% for c, a in airports.items() %}<option value="{{ c }}">{{ a[0] }} ({{ c }})</option>{% endfor %}</select>
      <input type="date" id="mapDate" min="{{ today.isoformat() }}">
      <select id="mapCurrency">{% for c in currencies %}<option>{{ c }}</option>{% endfor %}</select>
    </div>
    <div id="bigMap" class="map map-lg" data-map></div>
    <div class="map-info" id="mapInfo"></div>
  </div>
</section>
{% endblock %}
